services:
  db:
    image: postgres:17
    container_name: odoo20-argentina_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - ./db-data:/var/lib/postgresql/data
    restart: always

  odoo:
    build: .
    container_name: odoo20-argentina_odoo
    depends_on:
      - db
    ports:
      - "8070:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: always

  waha:
    image: devlikepro/waha:latest
    container_name: ${PROJECT_NAME:-odoo20-argentina}_waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-dolan-waha-key}
      WAHA_LOCALFILE_STORE_PATH: /app/.sessions
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3000:3000"
    volumes:
      - waha-store:/app/.sessions

volumes:
  waha-store:
